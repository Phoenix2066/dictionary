<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <h1>Dictionary</h1>
    </header>

    <div class="content">
        <div class="searchDiv">
            <input type="text" placeholder="Enter a word" class="inputBox"></input>
            <button class="search"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class = 'dataCont'>
            <div class="data"></div>
            <div class="data"></div>
            <div class="data"></div>
            <div class="data"></div>
            <div class="data"></div>
        </div>
    </div>

    <footer>
        <p>Made with <i class="fa-regular fa-heart"></i> by PRK</p>
        <p>Checkout Dictionary API at <a href="https://github.com/meetDeveloper/freeDictionaryAPI">https://github.com/meetDeveloper/freeDictionaryAPI</a></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
